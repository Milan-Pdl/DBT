sources:
  - name: source
    database: dbt_toturial-dev
    # equivalent to the catalog in a databrick
    schema: source  
    # *By default, schema will be the same as name. Add schema only if 
    # you want to use a source name that differs from the existing schema.
    tables:
      - name: dim_customer
      - name: dim_date
      - name: dim_product
      - name: dim_store
      - name: fact_returns
      - name: fact_sales



